name: Deploy DADO CBT to VPS Ubuntu 24.04

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, curl, gd, zip

      - name: Validate PHP Syntax (Lint)
        run: |
          find app public scripts -name "*.php" -print0 | xargs -0 -n1 php -l

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Execute Remote SSH Auto-Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo ">> Menjalankan Pembaruan Otomatis DADO CBT di VPS..."
            sudo /usr/local/bin/dadocbt-update
            echo ">> Memeriksa Status Layanan..."
            sudo /usr/local/bin/dadocbt-status

